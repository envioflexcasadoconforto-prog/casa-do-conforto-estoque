<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casa do Conforto — Estoque</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--site-primary:#54247d;--site-secondary:#eee5f7;--site-background:#f6f3f8;--site-on-primary:#ffffff;--site-on-secondary:#321747;--site-on-background:#241c2b;--site-font-body:Inter,Arial,sans-serif;--site-font-heading:Inter,Arial,sans-serif;--site-heading-scale:1;--site-spacing-scale:1;--site-radius-scale:1;--site-decoration-opacity:1;--ink:#241c2b;--muted:#746b7c;--line:#e6deeb;--surface:#fff;--good:#23784b;--warn:#a75b00;--bad:#b42335}
*{box-sizing:border-box}body{margin:0;background:var(--site-background);color:var(--ink);font-family:var(--site-font-body)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:calc(11px * var(--site-radius-scale));padding:11px 14px;background:var(--site-primary);color:white;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:var(--site-secondary);color:var(--site-on-secondary)}.danger{background:#fae8eb;color:#9e2031}.shell{min-height:100vh;background:var(--site-background)}.topbar{background:var(--site-primary);color:white;padding:22px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:#ffffff24;display:grid;place-items:center;font-size:24px}.topbar h1{font-size:calc(22px * var(--site-heading-scale));margin:0}.topbar p{margin:4px 0 0;font-size:13px;opacity:.85}.live-pill{border:1px solid #ffffff65;border-radius:99px;padding:8px 12px;font-size:12px;white-space:nowrap}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 88px)}aside{padding:22px 14px;border-right:1px solid var(--line)}.nav-label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:800;padding:0 12px 12px}.nav{display:grid;gap:6px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#5d5266;padding:12px;border-radius:11px}.nav button.active{background:var(--site-secondary);color:var(--site-primary)}.nav .ico{font-size:18px;width:24px;text-align:center}.aside-note{font-size:12px;line-height:1.5;color:var(--muted);padding:16px 10px;margin-top:24px;border-top:1px solid var(--line)}main{padding:clamp(16px,3vw,34px);min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:22px}.page-head h2{font-size:calc(26px * var(--site-heading-scale));margin:0}.page-head p{color:var(--muted);margin:6px 0 0}.eyebrow{color:var(--site-primary);font-size:11px;letter-spacing:.13em;font-weight:800;margin-bottom:7px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:calc(16px * var(--site-radius-scale));padding:18px;box-shadow:0 4px 16px #29123908;min-width:0}.stat-label{font-size:13px;color:var(--muted)}.stat-num{font-size:30px;font-weight:800;margin:10px 0 5px;letter-spacing:-.04em}.stat-foot{font-size:12px;color:var(--muted)}.stat-icon{float:right;background:var(--site-secondary);color:var(--site-primary);border-radius:11px;width:38px;height:38px;display:grid;place-items:center;font-size:19px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:25px 0 12px}.section-title h3{margin:0;font-size:17px}.muted{color:var(--muted)}.small{font-size:12px}.two-col{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr);gap:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.field{margin:9px 0}.field.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#62586b;margin-bottom:6px}input,select{width:100%;padding:11px 12px;border:1px solid #d8cedf;border-radius:10px;background:#fff;color:var(--ink);outline:none}input:focus,select:focus{border-color:var(--site-primary);box-shadow:0 0 0 3px #54247d18}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px;background:white}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #eee8f2;font-size:13px;vertical-align:middle}th{background:#faf8fc;color:#71677a;font-size:11px;text-transform:uppercase;letter-spacing:.06em}tr:last-child td{border-bottom:0}.tag{display:inline-flex;padding:5px 8px;border-radius:99px;background:#f0eaf6;color:var(--site-primary);font-size:11px;font-weight:800}.qty{font-weight:800}.empty{text-align:center;padding:30px;color:var(--muted)}.searchbar{display:flex;gap:8px;margin-bottom:12px}.searchbar input{flex:1}.scan-panel{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(260px,.85fr);gap:16px}.camera-box{background:#1d1723;border-radius:14px;overflow:hidden;min-height:260px;display:grid;place-items:center;position:relative;color:white}.camera-box video{width:100%;height:100%;min-height:260px;max-height:440px;object-fit:cover}.camera-placeholder{text-align:center;padding:24px;max-width:360px}.camera-placeholder .camico{font-size:46px;margin-bottom:12px}.camera-placeholder p{font-size:13px;color:#d4cadc;line-height:1.6}.camera-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.scan-result{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px;background:#fcfbfd}.scan-result h4{margin:0 0 8px}.result-code{font-size:21px;font-weight:800;word-break:break-word}.notice{padding:12px 14px;border-radius:10px;background:#f0eaf6;color:#50306b;font-size:13px;line-height:1.5}.notice.warn{background:#fff2db;color:#855000}.notice.good{background:#e7f5ec;color:#1e6c42}.progress{height:7px;background:#eee8f2;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--site-primary);width:0}.barrow{display:grid;grid-template-columns:110px 1fr 45px;gap:10px;align-items:center;margin:14px 0;font-size:12px}.history-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.history-item:last-child{border:0}.history-dot{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--site-secondary);flex-shrink:0}.history-item strong{font-size:13px}.history-item p{margin:4px 0 0;font-size:12px;color:var(--muted)}.footnote{font-size:12px;line-height:1.6;color:var(--muted);margin-top:18px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#211629;color:white;padding:13px 17px;border-radius:12px;box-shadow:0 8px 30px #0002;z-index:20;max-width:90vw}.mobile-nav{display:none}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col,.scan-panel{grid-template-columns:1fr}.layout{grid-template-columns:190px minmax(0,1fr)}}@media(max-width:650px){.topbar{padding:16px}.live-pill{display:none}.layout{display:block;min-height:auto}aside{display:none}.mobile-nav{display:flex;overflow:auto;gap:5px;padding:9px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.mobile-nav button{white-space:nowrap;padding:9px 11px;font-size:12px}.mobile-nav button.active{background:var(--site-secondary);color:var(--site-primary)}main{padding:17px 13px}.grid{gap:9px}.card{padding:14px}.stat-num{font-size:25px}.page-head h2{font-size:23px}.page-head{align-items:center}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.camera-box{min-height:220px}.barrow{grid-template-columns:85px 1fr 35px}}
</style>
</head>
<body><div class="shell" id="appRoot">
<header class="topbar"><div class="brand"><div class="logo">📦</div><div><h1>Casa do Conforto</h1><p>Central de controle de estoque</p></div></div><div class="live-pill">● SISTEMA DE ESTOQUE</div></header>
<div class="mobile-nav" id="mobileNav"></div>
<div class="layout"><aside><div class="nav-label">MENU PRINCIPAL</div><nav class="nav" id="sideNav"></nav><div class="aside-note">Controle organizado de produtos, leituras e movimentações.<br><br><b>Protótipo local</b><br>Os dados ficam salvos neste navegador.</div></aside>
<main id="main"></main></div></div><div id="toast" class="toast hidden"></div>
<script>
const navItems=[['dashboard','▦','Painel'],['scan','▣','Escanear'],['stock','▤','Estoque'],['history','◷','Histórico'],['cadastro','＋','Cadastro'],['reports','▥','Relatórios']];
const KEY='cdc_inventory_v1';let active='dashboard',html5QrCode=null,scanBusy=false,lastCameraCode='',lastCameraScanAt=0;
const seed=[{id:crypto.randomUUID(),code:'7909373966728',name:'Sofá-cama 128 cm',reference:'2669',extra:'C1 079EC',color:'Preto',measure:'128 cm',category:'Sofá-cama',stock:1,min:1,created:new Date().toISOString()}];
let db=loadDB();function loadDB(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.products))return x}catch(e){}return{products:seed,history:[]}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmtDate(d){return new Date(d).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}function totalUnits(){return db.products.reduce((a,p)=>a+Number(p.stock||0),0)}function lowCount(){return db.products.filter(p=>Number(p.stock)<=Number(p.min||0)).length}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2800)}
function navHTML(){const html=navItems.map(([id,ico,label])=>`<button class="${active===id?'active':''}" onclick="go('${id}')"><span class="ico">${ico}</span>${label}</button>`).join('');document.getElementById('sideNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=navItems.map(([id,ico,label])=>`<button class="${active===id?'active':''}" onclick="go('${id}')">${ico} ${label}</button>`).join('')}
function go(id){if(active==='scan'&&id!=='scan')stopCamera();active=id;render()}
function pageHead(kicker,title,sub,button=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${sub}</p></div>${button}</div>`}
function stat(label,num,foot,ico){return `<div class="card"><span class="stat-icon">${ico}</span><div class="stat-label">${label}</div><div class="stat-num">${num}</div><div class="stat-foot">${foot}</div></div>`}
function recentHTML(n=6){let items=db.history.slice().reverse().slice(0,n);if(!items.length)return '<div class="empty">Ainda não há movimentações registradas.</div>';return items.map(h=>`<div class="history-item"><div class="history-dot">${h.type==='Entrada'?'↗':h.type==='Saída'?'↘':h.type==='Cadastro'?'＋':'▣'}</div><div><strong>${esc(h.name)} <span class="tag">${esc(h.type)}</span></strong><p>${esc(h.code)} · ${h.delta>0?'+':''}${h.delta} un. · Estoque: ${h.stockAfter} un.</p><p>${fmtDate(h.date)}</p></div></div>`).join('')}
function dashboard(){let cats={};db.products.forEach(p=>cats[p.category||'Outros']=(cats[p.category||'Outros']||0)+Number(p.stock));let max=Math.max(1,...Object.values(cats));return pageHead('VISÃO GERAL','Painel de estoque','Acompanhe os produtos e as movimentações em um só lugar.',`<button onclick="go('scan')">▣ Escanear produto</button>`)+`<div class="grid">${stat('Produtos cadastrados',db.products.length,'Itens diferentes','▤')}${stat('Unidades em estoque',totalUnits(),'Soma das quantidades','▦')}${stat('Estoque baixo',lowCount(),'No limite mínimo ou abaixo','⚑')}${stat('Movimentações',db.history.length,'Registros no histórico','◷')}</div><div class="two-col"><section><div class="section-title"><h3>Movimentações recentes</h3><button class="secondary" onclick="go('history')">Ver histórico</button></div><div class="card">${recentHTML(5)}</div></section><section><div class="section-title"><h3>Estoque por categoria</h3><button class="secondary" onclick="go('reports')">Relatórios</button></div><div class="card">${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="progress"><span style="width:${v/max*100}%"></span></div><b>${v}</b></div>`).join(''):'<div class="empty">Cadastre produtos para ver o resumo.</div>'}</div><div class="notice" style="margin-top:14px">Dica: cadastre o código de barras de cada produto uma única vez. Nas próximas leituras, o sistema poderá atualizar a quantidade automaticamente.</div></section></div>`}
function scanPage(){return pageHead('LEITURA RÁPIDA','Escanear produto','Aponte a câmera traseira para o código de barras. Cada leitura válida atualiza o estoque automaticamente.')+`<div class="scan-panel"><section class="card"><div class="camera-box" id="cameraBox"><div class="camera-placeholder" id="cameraPlaceholder"><div class="camico">▣</div><b>Câmera pronta para iniciar</b><p>No iPhone, permita o acesso à câmera e mantenha o código inteiro, nítido e bem iluminado.</p></div><div id="qr-reader" class="hidden" style="width:100%"></div></div><div class="camera-controls"><button id="cameraStart" onclick="startCamera()">Abrir câmera</button><button class="secondary" onclick="stopCamera()">Parar</button></div><div id="scanStatus" class="notice" style="margin-top:13px">Ao reconhecer um código cadastrado, adicionaremos 1 unidade e salvaremos a movimentação. Para evitar duplicatas, retire o código da câmera e apresente-o novamente para contar outra unidade.</div><div class="field" style="margin-top:17px"><label>Digitar ou colar código manualmente</label><div class="searchbar"><input id="manualCode" placeholder="Ex.: 7909373966728" autocomplete="off"><button onclick="manualScan()">Registrar +1</button></div></div><div class="notice warn">A câmera só funciona no site publicado com HTTPS e após permitir o acesso no Safari. Os dados desta versão ficam neste navegador; ainda não são compartilhados automaticamente com outros aparelhos.</div></section><section class="card"><div class="eyebrow">ÚLTIMA LEITURA</div><h3 style="margin:0 0 8px">Resultado da leitura</h3><div id="lastScan"><div class="empty">Nenhum código lido nesta sessão.</div></div><div class="section-title"><h3>Encontrar produto</h3></div><div class="field"><label>Buscar por nome, referência ou código</label><input id="scanSearch" placeholder="Digite para localizar..." oninput="searchScanProducts()"></div><div id="scanMatches" class="small muted">Digite para pesquisar no cadastro.</div><div class="footnote">Esta versão lê códigos de barras. O reconhecimento do nome impresso na etiqueta (OCR) é uma etapa separada a integrar depois.</div></section></div>`}
function stockPage(){return pageHead('CATÁLOGO','Estoque','Consulte quantidades, referências, medidas e códigos cadastrados.',`<button onclick="go('cadastro')">＋ Novo produto</button>`)+`<section class="card"><div class="searchbar"><input id="stockSearch" placeholder="Buscar nome, código, referência, cor..." oninput="renderStockTable()"><select id="stockCategory" onchange="renderStockTable()" style="max-width:180px"><option value="">Todas categorias</option>${[...new Set(db.products.map(p=>p.category).filter(Boolean))].sort().map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div id="stockTable"></div></section>`}
function renderStockTable(){const root=document.getElementById('stockTable');if(!root)return;let q=(document.getElementById('stockSearch')?.value||'').toLowerCase(),cat=document.getElementById('stockCategory')?.value||'';let list=db.products.filter(p=>(!cat||p.category===cat)&&[p.name,p.code,p.reference,p.color,p.measure,p.extra,p.category].some(v=>String(v||'').toLowerCase().includes(q)));root.innerHTML=list.length?`<div class="table-wrap"><table><thead><tr><th>Produto</th><th>Código</th><th>Referência</th><th>Categoria / medida</th><th>Cor</th><th>Quantidade</th><th>Ações</th></tr></thead><tbody>${list.map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.extra)}</div></td><td>${esc(p.code)}</td><td>${esc(p.reference)}</td><td>${esc(p.category)}<div class="small muted">${esc(p.measure)}</div></td><td>${esc(p.color)}</td><td><span class="qty">${p.stock} un.</span>${Number(p.stock)<=Number(p.min||0)?'<div class="small" style="color:var(--warn)">Estoque baixo</div>':''}</td><td><button class="secondary" onclick="editProduct('${p.id}')">Editar</button> <button class="secondary" onclick="adjustProduct('${p.id}',1)">+1</button> <button class="secondary" onclick="adjustProduct('${p.id}',-1)">−1</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhum produto encontrado.</div>'}
function cadastroPage(){return pageHead('NOVO ITEM','Cadastro de produto','Cadastre os dados da etiqueta para que as próximas leituras sejam reconhecidas.')+`<div class="two-col"><section class="card"><form id="productForm" onsubmit="saveProduct(event)"><input type="hidden" id="pId"><div class="form-grid"><div class="field full"><label>Nome do produto *</label><input id="pName" required placeholder="Ex.: Sofá-cama 128 cm"></div><div class="field"><label>Código de barras / QR *</label><input id="pCode" required placeholder="Código único"></div><div class="field"><label>Referência</label><input id="pRef" placeholder="Ex.: 2669"></div><div class="field"><label>Categoria</label><select id="pCat"><option>Sofá</option><option>Sofá-cama</option><option>Colchão</option><option>Cama</option><option>Box</option><option>Poltrona</option><option>Acessório</option><option>Outros</option></select></div><div class="field"><label>Medida / tamanho</label><input id="pMeasure" placeholder="Ex.: 128 cm / Queen"></div><div class="field"><label>Cor</label><input id="pColor" placeholder="Ex.: Preto"></div><div class="field"><label>Código adicional</label><input id="pExtra" placeholder="Código da etiqueta"></div><div class="field"><label>Quantidade inicial</label><input id="pStock" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Alerta de estoque baixo</label><input id="pMin" type="number" min="0" step="1" value="1" required></div></div><div class="actions"><button type="submit">Salvar produto</button><button class="secondary" type="button" onclick="resetProductForm()">Limpar</button></div></form></section><section class="card"><div class="eyebrow">ORIENTAÇÃO</div><h3 style="margin-top:0">Cadastro inteligente</h3><p class="muted" style="font-size:13px;line-height:1.7">Use o mesmo código de barras impresso na etiqueta. Quando o código for escaneado novamente, o sistema encontrará este cadastro e atualizará a contagem.</p><div class="notice">Não cadastre duas vezes o mesmo código. Se um produto tiver códigos alternativos, registre-os no campo de código adicional ou evolua o cadastro para múltiplos códigos.</div><div class="section-title"><h3>Produtos recentes</h3></div>${db.products.slice(-4).reverse().map(p=>`<div class="history-item"><div class="history-dot">📦</div><div><strong>${esc(p.name)}</strong><p>${esc(p.code)} · ${p.stock} unidades</p></div></div>`).join('')||'<div class="empty">Nenhum produto cadastrado.</div>'}</section></div>`}
function historyPage(){return pageHead('AUDITORIA','Histórico de movimentações','Cada leitura e ajuste gera um registro com a quantidade anterior e a atual.',`<button class="secondary" onclick="exportCSV('history')">Exportar CSV</button>`)+`<section class="card"><div class="searchbar"><input id="historySearch" placeholder="Buscar por produto, código ou tipo..." oninput="renderHistoryTable()"></div><div id="historyTable"></div></section>`}
function renderHistoryTable(){const root=document.getElementById('historyTable');if(!root)return;let q=(document.getElementById('historySearch')?.value||'').toLowerCase();let rows=db.history.slice().reverse().filter(h=>[h.name,h.code,h.type].some(v=>String(v||'').toLowerCase().includes(q)));root.innerHTML=rows.length?`<div class="table-wrap"><table><thead><tr><th>Data / hora</th><th>Produto</th><th>Tipo</th><th>Variação</th><th>Antes</th><th>Depois</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${fmtDate(h.date)}</td><td><b>${esc(h.name)}</b><div class="small muted">${esc(h.code)}</div></td><td><span class="tag">${esc(h.type)}</span></td><td>${h.delta>0?'+':''}${h.delta}</td><td>${h.stockBefore}</td><td><b>${h.stockAfter}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma movimentação encontrada.</div>'}
function reportsPage(){let cats={};db.products.forEach(p=>cats[p.category||'Outros']=(cats[p.category||'Outros']||0)+Number(p.stock));let low=db.products.filter(p=>Number(p.stock)<=Number(p.min||0));return pageHead('ANÁLISE','Relatórios','Visão consolidada e exportação dos dados de estoque.',`<button onclick="exportCSV('products')">Exportar estoque CSV</button>`)+`<div class="grid">${stat('Tipos de produto',db.products.length,'Cadastros únicos','▤')}${stat('Unidades',totalUnits(),'Total atual','▦')}${stat('Estoque baixo',low.length,'Atenção necessária','⚑')}${stat('Movimentações',db.history.length,'Desde o início local','◷')}</div><div class="two-col"><section class="card"><div class="section-title" style="margin-top:0"><h3>Unidades por categoria</h3></div>${Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="progress"><span style="width:${v/Math.max(1,totalUnits())*100}%"></span></div><b>${v}</b></div>`).join(''):'<div class="empty">Sem dados para exibir.</div>'}</section><section class="card"><div class="section-title" style="margin-top:0"><h3>Itens com estoque baixo</h3></div>${low.length?low.map(p=>`<div class="history-item"><div class="history-dot">⚑</div><div><strong>${esc(p.name)}</strong><p>${p.stock} unidades · mínimo configurado: ${p.min}</p></div></div>`).join(''):'<div class="notice good">Nenhum produto está abaixo do limite mínimo.</div>'}</section></div><div class="card" style="margin-top:16px"><h3 style="margin-top:0">Backup local</h3><p class="muted" style="font-size:13px;line-height:1.6">Exporte os cadastros em CSV para abrir no Excel ou Google Sheets. Para cópia integral do sistema, use o backup JSON.</p><div class="actions"><button class="secondary" onclick="backupJSON()">Baixar backup JSON</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restaurar backup JSON</button><input id="restoreFile" class="hidden" type="file" accept="application/json" onchange="restoreJSON(event)"></div></div>`}
function render(){navHTML();let root=document.getElementById('main');if(active==='dashboard')root.innerHTML=dashboard();if(active==='scan')root.innerHTML=scanPage();if(active==='stock'){root.innerHTML=stockPage();renderStockTable()}if(active==='cadastro')root.innerHTML=cadastroPage();if(active==='history'){root.innerHTML=historyPage();renderHistoryTable()}if(active==='reports')root.innerHTML=reportsPage()}
function logMovement(p,type,delta,before){db.history.push({id:crypto.randomUUID(),date:new Date().toISOString(),productId:p.id,name:p.name,code:p.code,type,delta,stockBefore:before,stockAfter:Number(p.stock)});}
function processCode(code,source='Leitura'){code=String(code||'').trim();if(!code){toast('Informe um código primeiro.');return}let p=db.products.find(x=>x.code===code||String(x.extra||'').split(/[;, ]+/).includes(code));if(!p){document.getElementById('scanStatus').innerHTML=`<b>Código não cadastrado:</b> ${esc(code)}. Cadastre o produto na aba Cadastro.`;document.getElementById('pCode')?.setAttribute('value',code);$('manualCode').value=code;toast('Código não cadastrado');return}let before=Number(p.stock);p.stock=before+1;logMovement(p,source,1,before);persist();let ls=document.getElementById('lastScan');if(ls)ls.innerHTML=`<div class="scan-result"><div class="eyebrow">CONTAGEM REGISTRADA</div><h4>${esc(p.name)}</h4><div class="result-code">${esc(p.code)}</div><p class="muted small">Referência ${esc(p.reference)} · ${esc(p.color)} · ${esc(p.category)}</p><div class="notice good">Estoque atualizado: <b>${p.stock} unidade(s)</b> (+1)</div></div>`;let st=document.getElementById('scanStatus');if(st)st.innerHTML=`<b>Leitura contabilizada!</b> ${esc(p.name)} — estoque atualizado para ${p.stock}.`;let manual=document.getElementById('manualCode');if(manual)manual.value='';toast(`${p.name}: +1 unidade`)}
function manualScan(){processCode(document.getElementById('manualCode').value,'Leitura manual')}
function saveProduct(e){e.preventDefault();let id=document.getElementById('pId').value,code=document.getElementById('pCode').value.trim(),name=document.getElementById('pName').value.trim();if(db.products.some(p=>p.code===code&&p.id!==id)){toast('Este código já está cadastrado.');return}let existing=db.products.find(p=>p.id===id);if(existing){let before=Number(existing.stock);Object.assign(existing,{code,name,reference:val('pRef'),category:val('pCat'),measure:val('pMeasure'),color:val('pColor'),extra:val('pExtra'),stock:Number(val('pStock')),min:Number(val('pMin'))});let delta=existing.stock-before;if(delta)logMovement(existing,'Ajuste',delta,before);else logMovement(existing,'Edição',0,before);toast('Produto atualizado.')}else{let p={id:crypto.randomUUID(),code,name,reference:val('pRef'),category:val('pCat'),measure:val('pMeasure'),color:val('pColor'),extra:val('pExtra'),stock:Number(val('pStock')),min:Number(val('pMin')),created:new Date().toISOString()};db.products.push(p);logMovement(p,'Cadastro',p.stock,0);toast('Produto cadastrado.')}persist();active='stock';render()}
function val(id){return document.getElementById(id).value.trim()}function resetProductForm(){document.getElementById('productForm').reset();document.getElementById('pId').value='';document.getElementById('pStock').value=0;document.getElementById('pMin').value=1}
function editProduct(id){let p=db.products.find(p=>p.id===id);if(!p)return;active='cadastro';render();for(let [k,id2] of Object.entries({id:'pId',name:'pName',code:'pCode',reference:'pRef',category:'pCat',measure:'pMeasure',color:'pColor',extra:'pExtra',stock:'pStock',min:'pMin'}))document.getElementById(id2).value=p[k]??'';window.scrollTo({top:0,behavior:'smooth'})}
function adjustProduct(id,delta){let p=db.products.find(p=>p.id===id);if(!p)return;let amount=delta;if(delta<0&&p.stock<1){toast('Estoque já está zerado.');return}let before=Number(p.stock);p.stock=before+amount;logMovement(p,delta>0?'Entrada':'Saída',delta,before);persist();toast(`${p.name}: ${delta>0?'+':''}${delta} unidade(s)`)}
async function startCamera(){const status=$('scanStatus'),placeholder=$('cameraPlaceholder'),reader=$('qr-reader'),button=$('cameraStart');if(!window.isSecureContext){status.textContent='Para usar a câmera no iPhone, publique e abra o site por HTTPS. A prévia do editor pode bloquear a câmera.';return}if(!window.Html5Qrcode){status.textContent='O leitor não carregou. Confira a conexão com a internet e recarregue o site.';return}if(!navigator.mediaDevices?.getUserMedia){status.textContent='Este navegador não disponibiliza a câmera. Abra o site publicado no Safari atualizado.';return}try{button.disabled=true;html5QrCode=new Html5Qrcode('qr-reader');reader.classList.remove('hidden');placeholder.classList.add('hidden');await html5QrCode.start({facingMode:'environment'},{fps:8,qrbox:{width:280,height:140},aspectRatio:1.6},decodedText=>{let now=Date.now();if(scanBusy)return;if(decodedText===lastCameraCode&&now-lastCameraScanAt<3500){status.innerHTML='<b>Leitura repetida ignorada.</b> Retire o produto da câmera e apresente novamente para contar outra unidade.';return}lastCameraCode=decodedText;lastCameraScanAt=now;scanBusy=true;processCode(decodedText,'Leitura pela câmera');setTimeout(()=>{scanBusy=false},900)},()=>{});status.textContent='Câmera ativa. A mesma leitura é bloqueada por 3,5 segundos; retire e apresente novamente o código para contar outra unidade.'}catch(e){status.textContent='Não foi possível abrir a câmera: '+(e.message||e)+'. Permita a câmera no Safari e confirme que o site está em HTTPS.';await stopCamera()}}
async function stopCamera(){if(html5QrCode){try{if(html5QrCode.isScanning)await html5QrCode.stop();html5QrCode.clear()}catch(e){}html5QrCode=null}let reader=$('qr-reader');if(reader){reader.innerHTML='';reader.classList.add('hidden')}let ph=$('cameraPlaceholder');if(ph)ph.classList.remove('hidden');let b=$('cameraStart');if(b)b.disabled=false;scanBusy=false}
function searchScanProducts(){let root=document.getElementById('scanMatches'),q=(document.getElementById('scanSearch').value||'').toLowerCase();if(!q){root.textContent='Digite para pesquisar no cadastro.';return}let arr=db.products.filter(p=>[p.name,p.code,p.reference,p.color,p.category].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,8);root.innerHTML=arr.length?arr.map(p=>`<div class="history-item"><div style="flex:1"><b>${esc(p.name)}</b><p class="small muted">${esc(p.code)} · estoque ${p.stock}</p></div><button class="secondary" onclick="processCode('${esc(p.code)}','Contagem por busca')">+1</button></div>`).join(''):'Nenhum produto correspondente.'}
function exportCSV(kind){let rows=kind==='history'?[['Data','Produto','Código','Tipo','Variação','Antes','Depois'],...db.history.map(h=>[fmtDate(h.date),h.name,h.code,h.type,h.delta,h.stockBefore,h.stockAfter])]:[['Nome','Código','Referência','Categoria','Medida','Cor','Código adicional','Estoque','Mínimo'],...db.products.map(p=>[p.name,p.code,p.reference,p.category,p.measure,p.color,p.extra,p.stock,p.min])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(csv,kind==='history'?'historico_estoque.csv':'estoque_casa_do_conforto.csv','text/csv;charset=utf-8');}
function backupJSON(){download(JSON.stringify(db,null,2),'backup_casa_do_conforto.json','application/json')};function restoreJSON(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.products)||!Array.isArray(x.history))throw Error();if(confirm('Restaurar substituirá os dados deste navegador. Continuar?')){db=x;persist();toast('Backup restaurado.')}}catch(err){toast('Arquivo de backup inválido.')}};r.readAsText(f)}function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function $(id){return document.getElementById(id)}
render();
</script></body></html>
